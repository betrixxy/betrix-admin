# betrix-studio — üretim yığını (Mac Mini sunucusu). Bkz. CLAUDE.md 1.9.
#
#   cp .env.production.example .env.production   # doldur, chmod 600
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Ağ topolojisi:
#   internet ──HTTPS──► Cloudflare ──tünel──► cloudflared ──[frontend]──► caddy:80 ──► app:3000 ──[backend, internal]──► postgres:5432
# Hiçbir servis host'a port açmaz; `backend` ağı internete çıkışı olmayan iç ağdır.

name: betrix

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-database-url: &database-url postgresql://${POSTGRES_USER:-betrix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env.production içinde tanımlı olmalı}@postgres:5432/${POSTGRES_DB:-betrix}

# migrate'e ek olarak IP özet anahtarı oturum ayarı olarak verilir: TrafficLog'daki ham IP'ler migration içinde
# uygulamayla aynı HMAC'e çevrilip silinir (bkz. prisma/migrations/*_short_links_utm_ip_hash). Anahtar hex olmalı.
x-migrate-database-url: &migrate-database-url postgresql://${POSTGRES_USER:-betrix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env.production içinde tanımlı olmalı}@postgres:5432/${POSTGRES_DB:-betrix}?options=-c%20betrix.ip_hash_secret%3D${IP_HASH_SECRET:?IP_HASH_SECRET .env.production içinde tanımlı olmalı (openssl rand -hex 32)}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betrix}
      POSTGRES_USER: ${POSTGRES_USER:-betrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env.production içinde tanımlı olmalı}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  # Tek seferlik: bekleyen migration'ları uygular ve çıkar. app yalnızca bu başarıyla bitince kalkar.
  # Admin hesabı (ilk kurulumda bir kez):
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate npx prisma db seed --config prisma7.config.ts
  migrate:
    build:
      context: .
      target: migrator
    image: betrix-studio-migrator:latest
    restart: "no"
    env_file: .env.production
    environment:
      DATABASE_URL: *migrate-database-url
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *logging

  app:
    build:
      context: .
      target: runner
    image: betrix-studio:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/app/storage
      - next_cache:/app/.next/cache
    networks:
      - backend
      - frontend
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Saatlik metrik tetikleyicisi (salt okuma — CLAUDE.md 1.10, 4.4). Her saat :05'te iç ağdan
  # app:3000/api/internal/metrics/tick'i çağırır; hangi işin ne zaman çalışacağı tamamen MetricJob
  # tablosundadır — konteyner yeniden başlarsa hiçbir şey kaybolmaz, kaçırılan işler sonraki tetiklemede
  # çalışır. busybox crond iş başına grup/kullanıcı ayarladığı için yalnızca SETUID/SETGID yetkisi verilir.
  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:?INTERNAL_CRON_SECRET .env.production içinde tanımlı olmalı}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        mkdir -p /tmp/crontabs
        # Sır crontab satırında DEĞİL: crond her çalıştırmada komutun tamamını loglar. Header yalnızca
        # 700 izinli betikte durur, log'a sadece betiğin yolu düşer. tmpfs noexec olduğu için `sh` ile çağrılır.
        cat > /tmp/tick.sh <<EOF
        #!/bin/sh
        exec wget -q -T 120 -O - --header "x-cron-secret: $$INTERNAL_CRON_SECRET" --post-data '' http://app:3000/api/internal/metrics/tick
        EOF
        chmod 700 /tmp/tick.sh
        echo "5 * * * * /bin/sh /tmp/tick.sh >> /proc/1/fd/1 2>&1; echo >> /proc/1/fd/1" > /tmp/crontabs/root
        unset INTERNAL_CRON_SECRET
        exec crond -f -c /tmp/crontabs -l 6 -L /dev/stdout
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # İç ters vekil: güvenlik başlıkları, gövde sınırı, gerçek ziyaretçi IP'si. HTTPS Cloudflare
  # kenarında sonlandığı için ACME yok ve host'a HİÇBİR port açılmaz (bkz. Caddyfile).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN .env.production içinde tanımlı olmalı}
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Cloudflare Tunnel: Cloudflare'e GİDEN bir bağlantı açar; modemde port yönlendirme veya sabit
  # IP gerekmez. Yönlendirme (www.betrix.pro → http://caddy:80) Cloudflare panelinde tanımlıdır.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN .env.production içinde tanımlı olmalı}
    networks:
      - frontend
    depends_on:
      - caddy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
  storage:
  next_cache:
  caddy_data:
  caddy_config:
