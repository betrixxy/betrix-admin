services:
  postgres:
    image: postgres:16-alpine
    container_name: betrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: betrix
      POSTGRES_USER: betrix
      POSTGRES_PASSWORD: betrix
    ports:
      - "127.0.0.1:5432:5432" # yalnızca yerel makine; üretim için docker-compose.prod.yml
    volumes:
      - betrix_postgres_data:/var/lib/postgresql/data

volumes:
  betrix_postgres_data:
